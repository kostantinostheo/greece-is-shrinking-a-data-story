name: Build and deploy to GitHub Pages

on:
  # Every push to main (this includes merging a pull request into main) builds and deploys the site.
  push:
    branches: [main]
  # Pull requests only build, so a broken build is caught before the merge. They never deploy.
  pull_request:
    branches: [main]
  # Lets you run a deploy by hand from the Actions tab.
  workflow_dispatch:

# Needed by the Pages deploy steps.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a deploy that is still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # GitHub Pages has no server-side routing: unknown paths such as /greece-is-shrinking-a-data-story/team serve 404.html.
      # Serving the app shell there lets the router handle deep links and page refreshes.
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    # Skipped on pull requests.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
